<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>USFans x Salty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --promo-ratio: 1080 / 1440;      /* proporción de Imagen_plantilla.jpg */
      --promo-max-h: 92vh;
      --font: "Lexend", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    /* ---------- Página de registro a pantalla completa ---------- */
    #site {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ---------- Capa superpuesta ---------- */
    #promo-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      background: rgba(0, 0, 0, .62);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: overlay-in .35s ease-out both;
    }

    #promo-overlay.closing {
      animation: overlay-out .28s ease-in forwards;
      pointer-events: none;
    }

    @keyframes overlay-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlay-out { from { opacity: 1; } to { opacity: 0; } }

    /* ---------- Ventana ---------- */
    .promo {
      position: relative;
      /* Se ajusta siempre a la pantalla manteniendo la proporción 3:4 */
      width: min(92vw, calc(var(--promo-max-h) * 1080 / 1440));
      aspect-ratio: var(--promo-ratio);
      container-type: inline-size;       /* permite usar cqw para escalar textos */
      border-radius: 3.2cqw;
      border-radius: clamp(14px, 3vw, 28px);
      overflow: hidden;
      background: #fa7410 url("Imagen_plantilla.jpg") center / 100% 100% no-repeat;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
      animation: promo-in .45s cubic-bezier(.2, .9, .3, 1.15) both;
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    #promo-overlay.closing .promo {
      animation: promo-out .28s ease-in forwards;
    }

    @keyframes promo-in {
      from { opacity: 0; transform: scale(.92) translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes promo-out {
      from { opacity: 1; transform: none; }
      to   { opacity: 0; transform: scale(.95); }
    }

    /* La imagen real (accesible) para que se muestre aunque falle el fondo */
    .promo__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* ---------- Contador rojo ---------- */
    .timer {
      position: absolute;
      left: 10.56%;
      top: 61.6%;
      width: 29.63%;
      height: 13.9%;
      background: #f50000;
      border: .35cqw solid #fff;
      border-radius: 2.8cqw;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .9cqw;
      pointer-events: none;
    }

    .timer__label {
      font-size: 4.9cqw;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.01em;
    }

    .timer__digits {
      display: flex;
      align-items: center;
      gap: .9cqw;
    }

    .timer__digit {
      width: 5.2cqw;
      height: 6.9cqw;
      border: .38cqw solid #fff;
      border-radius: .9cqw;
      display: grid;
      place-items: center;
      font-size: 6.2cqw;
      font-weight: 300;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .timer__sep {
      font-size: 5.6cqw;
      font-weight: 400;
      line-height: 1;
      margin: 0 .1cqw;
      padding-bottom: .5cqw;
    }

    /* ---------- Botón "Canjear ahora" ---------- */
    .cta {
      position: absolute;
      left: 10.56%;
      top: 77.7%;
      width: 78.89%;
      height: 15.35%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.2cqw;
      border-radius: 3.9cqw;
      background: linear-gradient(100deg, #6fdc3e 0%, #98e52a 55%, #b9ec10 100%);
      color: #fff;
      overflow: hidden;
      pointer-events: none;           /* el clic lo gestiona la capa completa */
      box-shadow:
        0 0 0 .2cqw rgba(255, 255, 255, .25) inset,
        0 1.2cqw 3cqw rgba(143, 230, 40, .45);
      animation: cta-pulse 2.4s ease-in-out infinite;
    }

    .cta__text {
      position: relative;
      z-index: 2;
      font-size: 9.3cqw;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.015em;
      white-space: nowrap;
      /* efecto neón/brillo del texto */
      text-shadow:
        0 0 .8cqw rgba(255, 255, 255, .95),
        0 0 2.2cqw rgba(255, 255, 255, .55),
        0 0 4.5cqw rgba(255, 255, 255, .35);
    }

    .cta__chevron {
      position: relative;
      z-index: 2;
      width: 5.6cqw;
      height: 8.4cqw;
      filter:
        drop-shadow(0 0 .8cqw rgba(255, 255, 255, .95))
        drop-shadow(0 0 2.2cqw rgba(255, 255, 255, .5));
      animation: chevron-nudge 1.6s ease-in-out infinite;
    }

    /* Barrido de reflejo */
    .cta__shine {
      position: absolute;
      top: -20%;
      left: 0;
      width: 24%;
      height: 140%;
      z-index: 3;
      transform: translateX(-160%) skewX(-22deg);
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, .20) 35%,
        rgba(255, 255, 255, .75) 50%,
        rgba(255, 255, 255, .20) 65%,
        rgba(255, 255, 255, 0) 100%
      );
      filter: blur(.4cqw);
      animation: cta-shine 3.2s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    /* Brillo suave superior, tipo cristal */
    .cta::before {
      content: "";
      position: absolute;
      inset: 0 0 52% 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0));
      z-index: 1;
    }

    @keyframes cta-shine {
      0%        { transform: translateX(-160%) skewX(-22deg); }
      45%, 100% { transform: translateX(560%)  skewX(-22deg); }
    }

    @keyframes cta-pulse {
      0%, 100% {
        box-shadow: 0 0 0 .2cqw rgba(255,255,255,.25) inset, 0 1.2cqw 3cqw rgba(143, 230, 40, .40);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 .2cqw rgba(255,255,255,.35) inset, 0 1.4cqw 5cqw rgba(176, 240, 40, .75);
        transform: scale(1.012);
      }
    }

    @keyframes chevron-nudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(.9cqw); }
    }

    /* Foco visible por teclado */
    #promo-overlay:focus-visible .promo {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      #promo-overlay, .promo, .cta, .cta__chevron, .cta__shine { animation: none !important; }
      .cta__shine { display: none; }
    }
  </style>
</head>

<body>

  <!-- Página de registro detrás de la ventana -->
  <iframe
    id="site"
    src="https://www.usfans.com/register?ref=GRAS35"
    title="Registro USFans"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <!-- Ventana promocional: un clic en cualquier zona la cierra -->
  <div id="promo-overlay" role="dialog" aria-modal="true" aria-label="Promoción USFans x Salty" tabindex="0">
    <div class="promo">
      <img class="promo__img" src="Imagen_plantilla.jpg" alt="40% en tu envío y 800€ en cupones con USFans x Salty" draggable="false">

      <!-- Contador rojo (solo visual) -->
      <div class="timer" aria-hidden="true">
        <span class="timer__label">Termina en</span>
        <div class="timer__digits">
          <span class="timer__digit" id="d1">1</span>
          <span class="timer__digit" id="d2">2</span>
          <span class="timer__sep">:</span>
          <span class="timer__digit" id="d3">5</span>
          <span class="timer__digit" id="d4">4</span>
        </div>
      </div>

      <!-- Botón Canjear ahora (solo estético) -->
      <div class="cta" aria-hidden="true">
        <span class="cta__text">Canjear ahora</span>
        <svg class="cta__chevron" viewBox="0 0 56 84" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter">
          <polyline points="8,6 48,42 8,78"/>
        </svg>
        <span class="cta__shine"></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /* ---------- Cuenta atrás (visual) ---------- */
      var START_SECONDS = 12 * 60 + 54;            // 12:54
      var endTime = Date.now() + START_SECONDS * 1000;
      var digits = [
        document.getElementById('d1'),
        document.getElementById('d2'),
        document.getElementById('d3'),
        document.getElementById('d4')
      ];

      function render() {
        var left = Math.max(0, Math.round((endTime - Date.now()) / 1000));
        var m = Math.floor(left / 60);
        var s = left % 60;
        var txt = String(m).padStart(2, '0') + String(s).padStart(2, '0');
        for (var i = 0; i < 4; i++) digits[i].textContent = txt.charAt(i);
        if (left === 0) clearInterval(timerId);     // al llegar a 0 no ocurre nada
      }

      render();
      var timerId = setInterval(render, 250);

      /* ---------- Cerrar la ventana con un clic en cualquier zona ---------- */
      var overlay = document.getElementById('promo-overlay');
      var closed = false;

      function closePromo() {
        if (closed) return;
        closed = true;
        clearInterval(timerId);
        overlay.classList.add('closing');
        setTimeout(function () {
          overlay.remove();
          document.getElementById('site').focus();
        }, 300);
      }

      overlay.addEventListener('click', closePromo);
      overlay.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          closePromo();
        }
      });
      overlay.focus({ preventScroll: true });
    })();
  </script>
</body>
</html>
